name: Update lottery data

on:
  schedule:
    # 每天北京时间 21:30（UTC 13:30）自动抓取一次
    # 大乐透开奖日：周一/三/六；双色球开奖日：周二/四/日，抓取时间选在晚间已覆盖当天开奖
    - cron: '30 13 * * *'
  workflow_dispatch: {}   # 支持在 GitHub 网页上手动「Run workflow」

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest draw data
        run: python fetch_lottery.py

      - name: Commit & push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain lottery_data.json)" ]; then
            git add lottery_data.json
            git commit -m "chore: update lottery data $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No data change, skip commit"
          fi
